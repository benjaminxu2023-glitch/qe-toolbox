<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="留住今天"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>留住今天 · 私人日记</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><div class="eyebrow">MY DAILY JOURNAL</div><h1>留住今天<span class="dot">.</span></h1><p>每一天，都值得被温柔记录。</p></header><section id="listScreen"><button id="newBtn" class="primary">＋ 写一篇日记</button><input id="search" type="search" placeholder="搜索日记内容或标题" aria-label="搜索日记"><div class="between"><span id="count"></span><button id="backupBtn" class="quiet">备份 / 恢复</button></div><div id="entries"></div></section><section id="editorScreen" hidden><button id="backBtn" class="quiet">← 返回日记</button><label for="date">日期</label><input id="date" type="date"><label>今天的心情</label><div id="moods" class="moods"></div><label for="title">标题</label><input id="title" maxlength="100" placeholder="给今天起个标题"><label for="content">日记</label><textarea id="content" placeholder="今天发生了什么？有什么值得感恩、记录或思考的？"></textarea><button id="saveBtn" class="primary">保存日记</button><button id="deleteBtn" class="danger" hidden>删除这篇日记</button></section><section id="backupScreen" hidden><button id="backupBack" class="quiet">← 返回日记</button><h2>备份与恢复</h2><p class="note">日记只保存在当前设备的浏览器中，不会上传服务器。清理网站数据、卸载应用或更换设备可能导致丢失，请定期备份。</p><button id="exportBtn" class="primary">下载日记备份（JSON）</button><label for="importFile">从备份文件恢复</label><input id="importFile" type="file" accept=".json,application/json"><p class="note">导入会与现有日记按 ID 合并；相同 ID 的条目以备份文件为准。</p></section><footer>PRIVATE BY DESIGN · 本地保存，无需登录</footer></main><script src="app.js" defer></script></body></html>
